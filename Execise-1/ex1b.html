<!DOCTYPE html>
<html>
<head>
    <title>Hyperlinks Example</title>
</head>
<body>

    <h1>HTML Hyperlinks</h1>

    <h2>Normal Link</h2>
    <a href="https://www.google.com">
        Open Google
    </a>

    <br><br>

    <h2>Open Link in New Tab</h2>
    <a href="https://www.youtube.com" target="_blank">
        Open YouTube
    </a>

    <br><br>

    <h2>Open Another HTML Page</h2>
    <a href="about.html" target="_self">
        Go to About Page
    </a>

</body>
</html>
