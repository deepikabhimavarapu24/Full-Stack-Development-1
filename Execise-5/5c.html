<!DOCTYPE html>
<html>
<head>
    <title>CSS Font and Text Properties</title>

    <style>

        /* i. font-size */
        .size {
            font-size: 30px;
        }

        /* ii. font-weight */
        .weight {
            font-weight: bold;
        }

        /* iii. font-style */
        .style {
            font-style: italic;
        }

        /* iv. text-decoration */
        .decoration {
            text-decoration: underline;
        }

        /* v. text-transform */
        .transform {
            text-transform: uppercase;
        }

        /* vi. text-align */
        .align {
            text-align: center;
        }

    </style>
</head>

<body>

    <h1 class="align">CSS Font and Text Properties</h1>

    <p class="size">
        i. This text demonstrates font-size.
    </p>

    <p class="weight">
        ii. This text demonstrates font-weight.
    </p>

    <p class="style">
        iii. This text demonstrates font-style.
    </p>

    <p class="decoration">
        iv. This text demonstrates text-decoration.
    </p>

    <p class="transform">
        v. This text demonstrates text-transform.
    </p>

    <p class="align">
        vi. This text demonstrates text-align.
    </p>

</body>
</html>
