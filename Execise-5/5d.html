<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>

        .box {
            /* i. Content */
            width: 300px;
            height: 100px;

            /* ii. Border */
            border: 5px solid blue;

            /* iii. Margin */
            margin: 50px auto;

            /* iv. Padding */
            padding: 30px;

            background-color: lightyellow;

            text-align: center;
        }

    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        This is the Content area.
        <br><br>
        Border, Margin and Padding are also applied.
    </div>

</body>
</html>
