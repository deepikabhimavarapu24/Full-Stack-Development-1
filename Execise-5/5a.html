<!DOCTYPE html>
<html>
<head>
    <title>CSS Colors</title>

    <style>
        .name {
            color: red;
        }

        .hex {
            color: #0000ff;
        }

        .rgb {
            color: rgb(0, 128, 0);
        }

        .rgba {
            color: rgba(255, 0, 0, 0.6);
        }
    </style>
</head>

<body>

    <h2>Different Ways of Using Colors</h2>

    <p class="name">Color Name: Red</p>

    <p class="hex">HEX Color: Blue</p>

    <p class="rgb">RGB Color: Green</p>

    <p class="rgba">RGBA Color: Red with Transparency</p>

</body>
</html>
