<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Loops</title>
</head>
<body>
    <h2>Different Types of Loops</h2>

    <button onclick="displayNumbers()">Display Numbers</button>

    <p id="result"></p>

    <script>
        function displayNumbers() {
            let output = "";

            // For loop
            output += "For Loop: ";
            for (let i = 1; i <= 10; i++) {
                output += i + " ";
            }

            output += "<br><br>";

            // While loop
            output += "While Loop: ";
            let j = 1;

            while (j <= 10) {
                output += j + " ";
                j++;
            }

            output += "<br><br>";

            // Do-while loop
            output += "Do-While Loop: ";
            let k = 1;

            do {
                output += k + " ";
                k++;
            } while (k <= 10);

            document.getElementById("result").innerHTML = output;
        }
    </script>
</body>
</html>
