<!DOCTYPE html>
<html>
<head>
    <title>Object Loops</title>
</head>
<body>
    <h2>Object Data Using Different Loops</h2>

    <button onclick="displayData()">Display Object Data</button>

    <p id="result"></p>

    <script>
        function displayData() {

            let student = {
                name: "kavya",
                age: "19",
                course: "B.Tech IT"
            };

            let output = "";

            // for-in loop
            output += "<b>Using for-in loop:</b><br>";

            for (let key in student) {
                output += key + ": " + student[key] + "<br>";
            }

            // Array of objects
            let students = [
                {name: "kavya", age: 19},
                {name: "durga", age: 20},
                {name: "lakshmi", age: 21}
            ];

            // forEach loop
            output += "<br><b>Using forEach loop:</b><br>";

            students.forEach(function(s) {
                output += s.name + " - " + s.age + "<br>";
            });

            // for-of loop
            output += "<br><b>Using for-of loop:</b><br>";

            for (let s of students) {
                output += s.name + " - " + s.age + "<br>";
            }

            document.getElementById("result").innerHTML = output;
        }
    </script>
</body>
</html>
