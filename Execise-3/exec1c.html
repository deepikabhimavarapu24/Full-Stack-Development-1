<!DOCTYPE html>
<html>
<head>
    <title>Types of CSS</title>

    <!-- Internal CSS -->
    <style>
        .internal {
            color: blue;
            font-size: 20px;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Types of CSS</h1>

    <!-- Inline CSS -->
    <h2 style="color: red;">This is Inline CSS</h2>

    <!-- Internal CSS -->
    <p class="internal">This is Internal CSS</p>

    <!-- External CSS -->
    <p class="external">This is External CSS</p>

</body>
</html>
