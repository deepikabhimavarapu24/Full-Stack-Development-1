<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Operations</title>
</head>
<body>

    <h2>JavaScript Functions</h2>

    Enter a Number:
    <input type="number" id="num">

    <br><br>

    <button onclick="factorial()">Factorial</button>
    <button onclick="fibonacci()">Fibonacci</button>
    <button onclick="prime()">Prime</button>
    <button onclick="palindrome()">Palindrome</button>

    <h3 id="result"></h3>

    <script>

        // Factorial
        function factorial() {
            let n = Number(document.getElementById("num").value);
            let fact = 1;

            if (document.getElementById("num").value === "" || n < 0 || !Number.isInteger(n)) {
                document.getElementById("result").innerHTML = "Enter a valid number";
                return;
            }

            for (let i = 1; i <= n; i++) {
                fact = fact * i;
            }

            document.getElementById("result").innerHTML =
                "Factorial = " + fact;
        }

        // Fibonacci Series
        function fibonacci() {
            let n = Number(document.getElementById("num").value);
            let a = 0, b = 1;
            let series = "";

            if (document.getElementById("num").value === "" || n <= 0 || !Number.isInteger(n)) {
                document.getElementById("result").innerHTML = "Enter a valid positive number";
                return;
            }

            for (let i = 1; i <= n; i++) {
                series += a + " ";
                let c = a + b;
                a = b;
                b = c;
            }

            document.getElementById("result").innerHTML =
                "Fibonacci Series = " + series;
        }

        // Prime Number
        function prime() {
            let n = Number(document.getElementById("num").value);
            let flag = true;

            if (document.getElementById("num").value === "" || !Number.isInteger(n)) {
                document.getElementById("result").innerHTML = "Enter a valid integer";
                return;
            }

            if (n <= 1) {
                flag = false;
            }

            for (let i = 2; i < n; i++) {
                if (n % i === 0) {
                    flag = false;
                    break;
                }
            }

            if (flag) {
                document.getElementById("result").innerHTML =
                    n + " is a Prime Number";
            }
            else {
                document.getElementById("result").innerHTML =
                    n + " is not a Prime Number";
            }
        }

        // Palindrome
        function palindrome() {
            let n = document.getElementById("num").value;

            if (n === "" || !/^\d+$/.test(n)) {
                document.getElementById("result").innerHTML = "Enter a valid number";
                return;
            }

            let rev = n.split("").reverse().join("");

            if (n === rev) {
                document.getElementById("result").innerHTML =
                    n + " is a Palindrome";
            }
            else {
                document.getElementById("result").innerHTML =
                    n + " is not a Palindrome";
            }
        }

    </script>

</body>
</html>
