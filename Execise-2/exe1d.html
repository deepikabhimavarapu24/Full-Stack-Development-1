<!DOCTYPE html>
<html>
<head>
    <title>HTML Frames</title>
</head>

<body>

    <h1 align="center">Frames Example</h1>

    <table border="1" width="100%" height="500">
        <tr>

            <!-- Frame 1: Image -->
            <td width="33%" align="center">
                <h2>Image</h2>
                <img src="flower.jpg" width="200" height="200">
            </td>

            <!-- Frame 2: Paragraph -->
            <td width="34%" valign="top">
                <h2>Paragraph</h2>
                <p>
                    HTML is used to create webpages.
                    It provides different elements such as
                    tables, forms, images and hyperlinks.
                </p>
            </td>

            <!-- Frame 3: Hyperlink -->
            <td width="33%" align="center">
                <h2>Hyperlink</h2>
                <a href="https://www.google.com" target="_blank">
                    Visit Google
                </a>
            </td>

        </tr>
    </table>

    <noframes>
        <p>Your browser does not support frames.</p>
    </noframes>

</body>
</html>
